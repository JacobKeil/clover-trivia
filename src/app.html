<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-192.png" sizes="192x192" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#176249" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div
			id="initial-loading"
			role="status"
			aria-live="polite"
			aria-label="Loading page"
			aria-hidden="true"
			style="
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: none;
				place-items: center;
				background: rgba(255, 255, 255, 0.45);
				backdrop-filter: blur(1px);
			"
		>
			<span
				style="
					width: 32px;
					height: 32px;
					border: 3px solid #8fc9a1;
					border-top-color: #176249;
					border-radius: 50%;
					animation: initial-loading-spin 0.7s linear infinite;
				"
			></span>
		</div>
		<style>
			@keyframes initial-loading-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		<script>
			window.setTimeout(() => {
				const loader = document.getElementById('initial-loading');
				if (loader) {
					loader.style.display = 'grid';
					loader.setAttribute('aria-hidden', 'false');
				}
			}, 250);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
