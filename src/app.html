<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div
			id="initial-loading"
			role="status"
			aria-live="polite"
			aria-hidden="true"
			style="
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: none;
				place-items: center;
				background: rgba(255, 255, 255, 0.82);
				backdrop-filter: blur(1px);
			"
		>
			<div
				style="
					display: flex;
					align-items: center;
					gap: 12px;
					border: 1px solid #d7e5da;
					border-radius: 12px;
					background: #fff;
					padding: 16px 20px;
					color: #173f33;
					font:
						600 14px system-ui,
						sans-serif;
					box-shadow: 0 20px 32px rgba(23, 63, 51, 0.18);
				"
			>
				<span
					style="
						width: 20px;
						height: 20px;
						border: 2px solid #8fc9a1;
						border-top-color: #176249;
						border-radius: 50%;
						animation: initial-loading-spin 0.7s linear infinite;
					"
				></span>
				Loading…
			</div>
		</div>
		<style>
			@keyframes initial-loading-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		<script>
			window.setTimeout(() => {
				const loader = document.getElementById('initial-loading');
				if (loader) {
					loader.style.display = 'grid';
					loader.setAttribute('aria-hidden', 'false');
				}
			}, 250);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
